<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deployment status · Fomze Installer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  body{display:flex;flex-direction:column;min-height:100vh}
  .wrap-s{max-width:820px;margin:0 auto;padding:26px 20px 60px;width:100%}
  .topline{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .topline .logo{font-size:20px}
  .topline a{margin-left:auto;font-size:13px;color:var(--muted)}
  .hero-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;margin-bottom:16px}
  .hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .hero-top h1{font-size:20px;font-weight:700}
  .hero-top .tok{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .big-status{display:flex;align-items:center;gap:14px;margin:8px 0 22px}
  .big-dot{width:16px;height:16px;border-radius:50%;flex:none}
  .big-status .label{font-size:26px;font-weight:800;font-family:"Inter"}
  .big-status .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .bar{height:10px;border-radius:99px;background:var(--card3);overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
  /* state colors */
  .s-ready .big-dot{background:var(--muted)} .s-ready .bar>i{background:var(--muted)}
  .s-running .big-dot,.s-installing .big-dot{background:#5b8bff;animation:pulse 1.1s infinite} .s-running .bar>i,.s-installing .bar>i{background:#5b8bff}
  .s-online .big-dot{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.25)} .s-online .bar>i{background:var(--green)}
  .s-failed .big-dot{background:var(--red)} .s-failed .bar>i{background:var(--red)}
  .s-online .big-status .label{color:#5be08a}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .stages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .stage{font-size:11px;padding:5px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
  .stage.done{border-color:var(--green);color:#5be08a}
  .stage.active{border-color:#5b8bff;color:#8fb0ff}
  .conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
  .kv{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
  .kv .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .kv .v{font-family:var(--mono);font-size:14px;margin-top:4px;display:flex;align-items:center;gap:8px;word-break:break-all}
  .kv .v .cp{cursor:pointer;color:var(--muted);flex:none}
  .kv .v .cp:hover{color:var(--fg)}
  .ready-note{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#a7f3c8;font-size:14px}
  .card-s{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
  .card-s h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted)}
  .console{background:#07070a;border:1px solid var(--border);border-radius:10px;padding:14px;max-height:340px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:#9fe6b8;white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--faint);font-size:13px}
  footer{margin-top:auto}
</style>
</head>
<body class="s-ready">
<div class="wrap-s">
  <div class="topline">
    <div class="logo"><span class="a">Fomze</span><span class="b">Installer</span></div>
    <a href="/">← Panel</a>
  </div>

  <div class="hero-card">
    <div class="hero-top">
      <h1 id="osLabel">Deployment</h1>
      <span class="tok" id="tok"></span>
    </div>

    <div class="big-status">
      <span class="big-dot"></span>
      <div>
        <div class="label" id="statusLabel">Loading…</div>
        <div class="sub" id="statusSub">Fetching status…</div>
      </div>
    </div>

    <div class="bar"><i id="bar" style="width:6%"></i></div>
    <div class="stages" id="stages"></div>

    <div class="conn" id="conn" style="display:none">
      <div class="kv"><div class="k">Server IP</div><div class="v" id="vIp">—</div></div>
      <div class="kv"><div class="k">Port</div><div class="v" id="vPort">—</div></div>
      <div class="kv"><div class="k">Username</div><div class="v" id="vUser">—</div></div>
      <div class="kv"><div class="k">Password</div><div class="v" id="vPass">—</div></div>
    </div>

    <div class="ready-note" id="readyNote" style="display:none"></div>
  </div>

  <div class="card-s">
    <h2>Live log <span class="muted">— everything happening on your server</span></h2>
    <div class="console" id="events" style="max-height:360px;color:#c9d4ff"></div>
  </div>
</div>

<footer><div style="text-align:center;color:var(--faint);font-size:12px;padding:24px">Fomze Installer · live deployment status</div></footer>

<div class="toast" id="toast"></div>
<script>
const token = location.pathname.split("/").pop();
let _dl = { r: 0, t: 0 };   // download-speed tracker for the ETA
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function cp(el, val){ el.style.cursor="pointer"; el.title="Copy"; el.onclick=async()=>{try{await navigator.clipboard.writeText(val);toast("Copied");}catch{}}; }

const STAGES = ["start","network","download","reinstall","reboot","done"];
const STATE = {
  ready:      {label:"Ready",       sub:"Waiting for you to run the command on the server.", cls:"s-ready",     bar:6},
  running:    {label:"Deploying",   sub:"The server accepted the command and started.",       cls:"s-running",   bar:25},
  installing: {label:"Installing",  sub:"The OS is being installed on the server…",            cls:"s-installing",bar:60},
  rebooting:  {label:"Rebooting",   sub:"The server is rebooting into the new OS…",            cls:"s-running",   bar:80},
  online:     {label:"Online",      sub:"The server is up and reachable.",                     cls:"s-online",    bar:100},
  completed:  {label:"Completed",   sub:"Deployment finished.",                                cls:"s-online",    bar:100},
  failed:     {label:"Failed",      sub:"Something went wrong — check the logs below.",         cls:"s-failed",    bar:100},
};

function stageIndex(logs){ let i=0; for(const l of logs){const k=STAGES.indexOf(l.stage); if(k>i)i=k;} return i; }

async function tick(){
  let d;
  try{ d = await (await fetch("/api/status/"+token)).json(); }
  catch{ return; }
  if(d.error){ $("#statusLabel").textContent="Not found"; $("#statusSub").textContent=d.error; return; }

  const st = STATE[d.status] || STATE.running;
  document.body.className = st.cls;
  $("#osLabel").textContent = d.osLabel || "Deployment";
  $("#tok").textContent = token.slice(0,8)+"…";
  $("#statusLabel").textContent = st.label;

  // ---- smooth time-based progress + ETA (TinyInstaller-style) ----
  // Estimate from when the installer took over (reboot/installing event).
  const EST_SEC = /fast|⚡/i.test(d.osLabel||"") ? 10*60 : 16*60;  // fast dd vs ISO
  let sub = st.sub, barW = st.bar;
  if ((d.status==="installing" || d.status==="rebooting" || d.status==="running") && d.download && d.download.pct!=null && d.download.pct < 100) {
    // Real download progress (the target is pulling the image from the panel).
    const gb = (n)=> (n/1073741824).toFixed(1);
    const now = Date.now();
    let etaTxt = "";
    if (_dl.t && d.download.received > _dl.r) {
      const spd = (d.download.received - _dl.r) / ((now - _dl.t) / 1000);   // bytes/s
      if (spd > 0) {
        const secs = Math.max(0, Math.round((d.download.total - d.download.received) / spd));
        etaTxt = secs > 90 ? ` · about ${Math.ceil(secs/60)} min left` : ` · about ${secs} sec left`;
      }
    }
    _dl = { r: d.download.received, t: now };
    sub = `Downloading OS image to the server · ${d.download.pct}%  (${gb(d.download.received)} / ${gb(d.download.total)} GB)${etaTxt}`;
    barW = Math.max(6, Math.round(d.download.pct * 0.55));   // download = first ~55% of the bar
  } else if (d.status==="installing" || d.status==="rebooting") {
    const logs = d.logs||[];
    const kick = [...logs].reverse().find(l => l.stage==="reboot" || l.stage==="reinstall");
    const t0 = kick ? new Date(kick.at).getTime() : (logs[0]? new Date(logs[0].at).getTime() : Date.now());
    const elapsed = Math.max(0,(Date.now()-t0)/1000);
    const frac = Math.min(0.97, elapsed/EST_SEC);           // never hit 100% until Online
    barW = Math.max(58, Math.round(58 + frac*39));          // 58% -> 97% (download filled the first ~55%)
    const remain = Math.max(0, Math.ceil((EST_SEC-elapsed)/60));
    sub = remain>0 ? `Writing image + first boot · about ${remain} min remaining…`
                   : "Almost there · finishing up and waiting for the server to come online…";
  } else if (d.status==="online" || d.status==="completed") {
    barW = 100; sub = "The server is up and reachable. Connect with the details below.";
  }
  $("#statusSub").textContent = sub;
  $("#bar").style.width = barW + "%";

  // stages
  const isDone = d.status==="online"||d.status==="completed";
  const si = isDone ? STAGES.length-1 : stageIndex(d.logs||[]);
  $("#stages").innerHTML = STAGES.map((s,i)=>{
    const cls = i<si||isDone ? "done" : (i===si && d.status!=="ready" ? "active" : "");
    return `<span class="stage ${cls}">${s}</span>`;
  }).join("");

  // connection details
  const showConn = d.serverIp || d.status!=="ready";
  $("#conn").style.display = showConn ? "" : "none";
  if(showConn){
    setKv("#vIp", d.serverIp || "pending…", d.serverIp);
    setKv("#vPort", d.port, d.port);
    setKv("#vUser", d.username, d.username);
    setKv("#vPass", d.password || "pending…", d.password);
  }

  // ready note
  if(isDone && d.serverIp){
    const proto = (d.osType==="windows") ? "Remote Desktop (RDP)" : "SSH";
    $("#readyNote").style.display="";
    $("#readyNote").innerHTML = `✓ <b>Ready.</b> Connect via ${proto} to <b>${esc(d.serverIp)}:${esc(d.port)}</b> as <b>${esc(d.username)}</b> using the password above.`
      + (d.postInstall ? `<br><span class="muted">Post-install for ${esc(d.postInstall.label)} is available in the panel.</span>` : "");
  } else $("#readyNote").style.display="none";

  // one unified Live log: staged events (+ any relayed engine log at the bottom)
  const ev=$("#events");
  const atBottom = ev.scrollTop+ev.clientHeight >= ev.scrollHeight-40;
  let html = (d.logs||[]).map(l=>`<div><span style="color:var(--faint)">${(l.at||"").slice(11,19)}</span> ${esc(l.stage?"["+l.stage+"] ":"")}${esc(l.message)}</div>`).join("");
  if(d.installLog){ html += `<div style="color:var(--faint);margin-top:8px">— streamed from the installer —</div><div>${esc(d.installLog)}</div>`; }
  ev.innerHTML = html || '<div class="muted">Waiting for the server to run the command…</div>';
  if(atBottom) ev.scrollTop = ev.scrollHeight;
}
function setKv(sel,text,copyVal){ const el=$(sel); el.innerHTML=esc(text); if(copyVal){ const b=document.createElement("span"); b.className="cp"; b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'; cp(b,String(copyVal)); el.appendChild(b);} }

tick();
setInterval(tick, 4000);
</script>
</body>
</html>
