services:
  panel:
    build: .
    container_name: tinyinstaller-panel
    restart: unless-stopped
    environment:
      - PORT=8787
      - TI_SECRET=${TI_SECRET:?set TI_SECRET in .env}
      - TI_ACCESS_KEY=${TI_ACCESS_KEY:-fomze-owner-change-me}
      - TI_TOTP_SECRET=${TI_TOTP_SECRET:-}
    volumes:
      - ./data:/app/data
    # Bind to localhost only: with the Caddy TLS profile, Caddy reaches the panel
    # over the internal docker network (panel:8787), so the panel is NEVER exposed
    # on plain HTTP to the internet. (Locally reachable at 127.0.0.1:8787 for debug.)
    ports:
      - "127.0.0.1:8787:8787"

  # ---- Optional: automatic HTTPS via Caddy --------------------------------
  # Enable with:  DOMAIN=panel.example.com docker compose --profile tls up -d
  # Then remove the panel "ports" mapping above so only Caddy is exposed.
  caddy:
    image: caddy:2-alpine
    container_name: tinyinstaller-caddy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - panel
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
